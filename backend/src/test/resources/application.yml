server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:quality_trace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed-h2.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

app:
  jwt:
    secret: test-secret-key-test-secret-key-test-secret-key-0123456789
    ttl-seconds: 3600
