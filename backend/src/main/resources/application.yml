server:
  port: 8080

spring:
  application:
    name: quality-trace
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:54320}/${DB_NAME:app_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
      continue-on-error: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-quality-trace-please-change-in-prod-0123456789}
    ttl-seconds: 43200

logging:
  level:
    com.generated.qualityTrace: INFO
